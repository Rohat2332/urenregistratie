name: Unit Tests CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run_unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      
      # FIX 1: Herstel ALLEEN de Unit Test projectafhankelijkheden
      - name: Restore Dependencies (UnitTests)
        run: dotnet restore ./HourRegistration.Test/HourRegistration.Test.csproj
      
      # FIX 2: Bouw ALLEEN het Unit Test project
      - name: Build Unit Test Project
        run: dotnet build ./HourRegistration.Test/HourRegistration.Test.csproj --configuration Release --no-restore
      
      # FIX 3: Voer de tests uit op het correcte projectpad
      - name: Run Unit Tests & Collect Coverage
        run: |
          dotnet test ./HourRegistration.Test/HourRegistration.Test.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage"

      - name: Upload Test Results (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/*.trx'
